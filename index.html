:root{--paper:#faf9f6;--white:#fff;--green:#1b4332;--green-mid:#376449;--green-soft:#e9eee7;--earth:#c26d2d;--ink:#1c1917;--stone:#57534e;--line:#e5e2dc;--serif:'Fraunces',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}button{color:inherit}img{display:block;width:100%;object-fit:cover}figure,p,h1,h2,h3,h4{margin:0}p{color:var(--stone)}button{background:none;border:0}h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.045em;color:var(--green);line-height:1.08}h2{font-size:clamp(36px,4vw,53px)}h3,h4{font-weight:550;line-height:1.35}em{font-weight:400}::selection{background:#d9e5d7;color:var(--green)}:focus-visible{outline:2px solid var(--earth);outline-offset:5px}button,input,textarea,select,a{touch-action:manipulation}.container{max-width:1280px;margin-inline:auto;padding-inline:60px}.section{padding-block:100px}.icon{width:22px;height:22px;flex-shrink:0;vertical-align:middle}.eyebrow{font-size:10px;letter-spacing:1.7px;font-weight:650;line-height:1.5;display:inline-flex;align-items:center;gap:10px;color:var(--green)}.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}.button{display:inline-flex;justify-content:center;align-items:center;gap:27px;padding:15px 23px;background:var(--green);border:1px solid var(--green);color:var(--white);font-size:13px;font-weight:550;border-radius:4px;line-height:1.4;transition:background .2s,transform .2s;min-height:49px}.button:hover{background:#2c5941;transform:translateY(-1px)}.button .icon{width:18px;height:18px}.button-small{font-size:12px;min-height:43px;padding:11px 18px;gap:20px}.button-outline{background:transparent;color:var(--green);border-color:#bec8bf}.button-outline:hover{background:var(--green-soft)}.text-link{display:inline-flex;gap:22px;align-i  const menu=e.target.closest('.menu-toggle');if(menu){const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',open);menu.setAttribute('aria-label',open?'Cerrar menú':'Abrir menú');document.querySelector('#main-nav').classList.toggle('is-open',open);menu.innerHTML=icon(open?'close':'menu');}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();const tab=e.target.closest('[role="tab"]');if(!tab)return;const tabs=[...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];let next=tabs.indexOf(tab);if(e.key==='ArrowRight'||e.key==='ArrowDown')next=(next+1)%tabs.length;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')next=(next+tabs.length-1)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;e.preventDefault();tabs[next].click();tabs[next].focus();});
